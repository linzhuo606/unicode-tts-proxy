name: build

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
  workflow_dispatch:

jobs:
  core-tests:
    name: core 单元测试
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      # 三个构建都带 wrapper，setup-gradle 只负责缓存
      - uses: gradle/actions/setup-gradle@v4

      # core 是独立的纯 Kotlin 构建，不需要 Android SDK
      - name: 跑 core 测试
        working-directory: core
        run: ./gradlew test --stacktrace

      - name: 上传测试报告
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: core-test-report
          path: core/build/reports/tests/test

  apk:
    name: 构建测试版 APK
    runs-on: ubuntu-latest
    needs: core-tests
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      # android 通过 includeBuild("../core") 复合引入 core
      - name: assembleDebug
        working-directory: android
        run: ./gradlew :app:assembleDebug --stacktrace

      # 测试版用的是每台 CI 机器临时生成的调试签名，**每次都不一样**，
      # 装过一个再装另一个会签名冲突。只给开发者验证用，普通用户请装 Releases 里的正式版。
      - name: 上传 APK
        uses: actions/upload-artifact@v4
        with:
          name: ttsproxy-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk

  release:
    name: 发布正式版
    # 推送 v 开头的标签（比如 v0.2.0）时才发布
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    needs: core-tests
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: 核对标签和版本号
        run: |
          want="${GITHUB_REF_NAME#v}"
          have=$(sed -n 's/.*versionName = "\(.*\)".*/\1/p' android/app/build.gradle.kts)
          if [ "$want" != "$have" ]; then
            echo "::error::标签是 $GITHUB_REF_NAME，但 build.gradle.kts 里的 versionName 是 $have。先改版本号（versionCode 也要加一）再打标签。"
            exit 1
          fi

      # 密钥只存在 GitHub Secrets 里，绝不入库。缺了就直接失败——
      # 发一个没签名、或者换了签名的包，用户都没法正常升级。
      - name: 还原签名密钥
        env:
          KEYSTORE_BASE64: ${{ secrets.TTSPROXY_KEYSTORE_BASE64 }}
        run: |
          if [ -z "$KEYSTORE_BASE64" ]; then
            echo "::error::没有配置签名密钥，见 docs/RELEASING.md"
            exit 1
          fi
          echo "$KEYSTORE_BASE64" | base64 -d > "$RUNNER_TEMP/release.jks"
          echo "TTSPROXY_KEYSTORE=$RUNNER_TEMP/release.jks" >> "$GITHUB_ENV"

      - name: assembleRelease
        working-directory: android
        env:
          TTSPROXY_KEYSTORE_PASSWORD: ${{ secrets.TTSPROXY_KEYSTORE_PASSWORD }}
          TTSPROXY_KEY_ALIAS: ${{ secrets.TTSPROXY_KEY_ALIAS }}
          TTSPROXY_KEY_PASSWORD: ${{ secrets.TTSPROXY_KEY_PASSWORD }}
        run: ./gradlew :app:assembleRelease --stacktrace

      - name: 校验签名并改名
        run: |
          apk=android/app/build/outputs/apk/release/app-release.apk
          if [ ! -f "$apk" ]; then
            echo "::error::没有产出签过名的 release 包"
            exit 1
          fi
          apksigner=$(find "$ANDROID_HOME/build-tools" -name apksigner | sort | tail -1)
          "$apksigner" verify --print-certs "$apk"
          cp "$apk" "unicode-tts-proxy-$GITHUB_REF_NAME.apk"

      - name: 建 Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" "unicode-tts-proxy-$GITHUB_REF_NAME.apk" \
            --title "$GITHUB_REF_NAME" --generate-notes
